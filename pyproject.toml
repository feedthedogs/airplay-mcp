[project]
name = "airplay-mcp"
version = "0.1.3"
description = "MCP server that receives AirPlay screen mirroring and lets AI clients see the phone screen, token-efficiently"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.2",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pylibairplay[net]>=0.1.1",
]

[project.urls]
Homepage = "https://github.com/feedthedogs/airplay-mcp"
Issues = "https://github.com/feedthedogs/airplay-mcp/issues"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
ocr = ["rapidocr>=2", "onnxruntime"]
# Lets the FairPlay emulator run under this same interpreter (no --fp-emu-python needed).
fairplay = ["unicorn>=2", "lief>=0.14", "capstone>=5"]

[project.scripts]
airplay-mcp = "airplay_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
