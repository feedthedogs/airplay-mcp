# Pins the exact dependency set the plugin's MCP server runs with (see uv.lock).
# Bump the airplay-mcp version here and in .mcp.json together, then run `uv lock`.
[project]
name = "airplay-mcp-plugin"
version = "0.1.3"
requires-python = ">=3.12"
dependencies = ["airplay-mcp[fairplay]==0.1.3"]

[tool.uv]
package = false
